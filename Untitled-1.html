<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <div class="contenedor">
      <header class="encabezado">
        <div class="logo">REGISTRO DIGITAL</div>
        <h1>Formulario de Registro</h1>
        <p>Complete los siguientes datos para realizar su registro.</p>
      </header>

      <form id="formulario">
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Ingrese su nombre completo"
            required
          />
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input
            type="email"
            id="correo"
            name="correo"
            placeholder="ejemplo@correo.com"
            required
          />
        </div>

        <div class="campo">
          <label for="telefono">Número de teléfono</label>
          <input
            type="tel"
            id="telefono"
            name="telefono"
            placeholder="809-000-0000"
            required
          />
        </div>

        <div class="campo">
          <label for="empresa">Empresa a la que pertenece</label>
          <input
            type="text"
            id="empresa"
            name="empresa"
            placeholder="Ingrese el nombre de la empresa"
            required
          />
        </div>

        <button type="submit" id="btnEnviar">Enviar registro</button>

        <p id="mensaje"></p>
      </form>

      <footer>Formulario digital de registro</footer>
    </div>

    <script src="script.js"></script>

    <iframe
      name="marcoEnvio"
      id="marcoEnvio"
      title="Envío de formulario"
      style="display: none"
    >
    </iframe>
  </body>
</html>
